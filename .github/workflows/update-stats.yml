name: Update language chart

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_languages.py
      - name: Commit if changed
        run: |
          git config user.name "Vrushabh Bodarya"
          git config user.email "vrushabhbodaryaait@gmail.com"
          git add assets/languages.svg
          git diff --cached --quiet || (git commit -m "Update language chart" && git push)
